<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="icon" type="image/png" href="../imagenes/icono-64px.png" />
    <title>Admin - Davra</title>
  </head>
  <body>
    <!-- LOGO HEADER -->
    <header class="header">
      <img
        class="header__imagen"
        src="../imagenes/DAvRA-logo-paquete/01_principal/daura-simbolo-blanco-transparente.png"
        alt="logo Davra"
      />
    </header>

    <!--BARRA DE NAV-->
    <nav class="menu">
      <a class="menu__link" href="../index.html">INICIO</a>
      <a class="menu__link" href="hombre.html">HOMBRE</a>
      <a class="menu__link" href="mujer.html">MUJER</a>
      <a class="menu__link" href="carrito.html">🛒CARRITO (<span class="menu__contador">0</span>)</a>
    </nav>

    <main class="main-admin">
      <h1>Panel de administrador</h1>
      <div class="formulario">
        <form class="admin__formulario">
          <label class="admin__nombre" for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required />
          <label class="admin__precio" for="precio">Precio</label>
          <input id="precio" name="precio" type="number" required min="1" />
          <label for="talla">Talla</label>
          <select id="talla" name="talla" required>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
          </select>
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
          </select>
          <label class="admin__imagen" for="imagen">Imagen</label>
          <input id="imagen" name="imagen" type="text" required />
          <button class="admin__agregar" type="submit">Agregar producto</button>
        </form>
      </div>
      <div class="admin">
        <table class="admin__tabla">
          <thead>
            <tr>
              <th>#</th>
              <th>Foto</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Talla</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody class="admin__lista"></tbody>
        </table>
      </div>
    </main>
    <script type="module" src="../js/admin.js"></script>
  </body>
</html>
